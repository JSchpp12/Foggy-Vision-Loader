[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "foggy_vision_loader"
version = "0.3.0"
description = "Query and selection library for the FoggyVision synthetic fog image corpus"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jacob Schaupp", email = "jacob.schaupp@gmail.com"}
]
keywords = ["fog", "visibility", "dataset", "sqlite", "computer-vision"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[tool.setuptools]
packages = ["foggy_vision_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
