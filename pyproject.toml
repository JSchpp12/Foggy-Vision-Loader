[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "foggy_vision_loader"
version = "0.4.0"
description = "Import, query, and select the FoggyVision synthetic fog image corpus"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jacob Schaupp", email = "jacob.schaupp@gmail.com"}
]
dependencies = [
  "Pillow",
  "tqdm",
]

[project.scripts]
fogvis-cli = "foggy_vision_loader.cli:main"

[tool.setuptools]
packages = [
  "foggy_vision_loader",
  "foggy_vision_loader.common",
  "foggy_vision_loader.db",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
